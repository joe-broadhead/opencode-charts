name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is part of the group, so a run by hand on master never cancels the push run a release stands on.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: boxd-public
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # the Bun the build and the unit, browser and eval stages run with
          # The public runner's restored Bun cache points at another HOME; install Bun fresh.
          no-cache: true
      - name: Lint the workflows
        run: |
          set -euo pipefail
          version=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -sSfLO "${base}/actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfLO "${base}/actionlint_${version}_checksums.txt"
          grep " actionlint_${version}_linux_amd64.tar.gz$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${version}_linux_amd64.tar.gz" actionlint
          ./actionlint -color .github/workflows/ci.yml .github/workflows/release.yml
      - name: Fetch the contract over HTTPS
        # The contract is a public repository, and npm records its GitHub dependency over ssh. A runner has no key.
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --ignore-scripts
      # The browser stage's headless Chromium: the build that playwright-core's exact version in package-lock.json pins.
      # A GitHub-hosted runner needs --with-deps for the system libraries; the self-hosted public runner already has
      # them and has no passwordless sudo, so it installs only the browser.
      - name: Headless Chromium for the browser stage
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            npx --no-install playwright-core install --with-deps --only-shell chromium
          else
            npx --no-install playwright-core install --only-shell chromium
          fi
      # The one stock binary the host stage spawns: the release `tested on` in the docs and in TESTED_HOSTS (src/status.ts).
      - name: Stock OpenCode 2.4.1 binary
        run: |
          platform="$(node -p 'process.platform')-$(node -p 'process.arch')"
          dir="$RUNNER_TEMP/stock-2.4.1"
          mkdir -p "$dir"
          (cd "$dir" && npm init -y >/dev/null && npm install "@opencode/cli@2.4.1" "@opencode/cli-$platform@2.4.1" --omit=optional --ignore-scripts --no-audit --no-fund)
          echo "OPENCODE_BIN_2_4_1=$dir/node_modules/@opencode/cli-$platform/bin/opencode" >> "$GITHUB_ENV"
      - run: npm run check
      # The release installs from a Git tag; prove the same Git install on this head, in an isolated home, with the stock
      # 2.4.1 binary. A fork PR's head commit is not in this repository, so the step is skipped there.
      - name: Install the plugin from the pushed commit
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          mkdir -p "$home/c" "$home/k" "$home/d" "$home/s"
          HOME="$home" XDG_CONFIG_HOME="$home/c" XDG_CACHE_HOME="$home/k" XDG_DATA_HOME="$home/d" XDG_STATE_HOME="$home/s" \
            "$OPENCODE_BIN_2_4_1" plugin add "github:we-the-rebel-alliance/charts-plugin#${HEAD_SHA}"
          installed="$(find "$home" -path '*/node_modules/@we-the-rebel-alliance/charts-plugin/dist/index.js' -type f -print -quit)"
          case "$installed" in
            */node_modules/@we-the-rebel-alliance/charts-plugin/dist/index.js) ;;
            *) echo "::error::the Git install has no node_modules/@we-the-rebel-alliance/charts-plugin/dist/index.js"; exit 1 ;;
          esac
          test -f "$installed"
          echo "installed $installed"
      # The bundle regenerates dist/, THIRD_PARTY_NOTICES.md and licenses/; all are committed, so they must not change.
      # dist/ is committed because a git-tag install runs with lifecycle scripts disabled and never builds it.
      - name: The committed dist and generated files are current
        run: |
          npm run bundle
          git diff --exit-code -- dist
          git diff --exit-code
          test -z "$(git status --porcelain -- dist THIRD_PARTY_NOTICES.md licenses)"
