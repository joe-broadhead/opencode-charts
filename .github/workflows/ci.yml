name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint parses the workflows as workflows, not as YAML. Version 1.7.12 knows the macos-26 runner labels; 1.7.7 does not.
      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -sSfLO "${base}/actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfLO "${base}/actionlint_${version}_checksums.txt"
          grep " actionlint_${version}_linux_amd64.tar.gz$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${version}_linux_amd64.tar.gz" actionlint
          ./actionlint -color .github/workflows/ci.yml .github/workflows/release.yml
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Public GitHub-hosted runners: Linux x64 and arm64, macOS arm64 and x64. The same input must give the same
        # bytes on each, so the golden SVGs are checked on all four.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # the Bun inside stock OpenCode 2.2.3, 2.2.4, 2.2.5 and 2.2.6
      - run: npm ci --ignore-scripts
      # The stock binaries the host stage spawns, so every tested release really runs in CI (R11).
      - name: Stock OpenCode binaries
        run: |
          platform="$(node -p 'process.platform')-$(node -p 'process.arch')"
          for version in 2.2.3 2.2.4 2.2.5 2.2.6; do
            dir="$RUNNER_TEMP/stock-$version"
            mkdir -p "$dir"
            (cd "$dir" && npm init -y >/dev/null && npm install "@opencode/cli@$version" "@opencode/cli-$platform@$version" --omit=optional --ignore-scripts --no-audit --no-fund)
            echo "OPENCODE_BIN_${version//./_}=$dir/node_modules/@opencode/cli-$platform/bin/opencode" >> "$GITHUB_ENV"
          done
      - run: npm run check
      # The build regenerates THIRD_PARTY_NOTICES.md and licenses/; both are committed, so they must not change.
      - name: The generated files are committed
        run: git diff --exit-code
