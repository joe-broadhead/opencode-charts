name: Release

# A tag v<package.json version> on a master commit whose CI passed creates the GitHub Release. Releases are not
# published to npm: a consumer pins the tag, github:we-the-rebel-alliance/charts-plugin#v<version>, and the committed
# dist/ is what that tag installs, with no build. Only the owner decides a release; an agent never pushes a tag on its
# own.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          token: ""
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
          token: ""
      - name: Check the tag names the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not name package version $version"; exit 1; }
      - name: Fetch the contract over HTTPS
        # The contract is a public repository, and npm records its GitHub dependency over ssh. A runner has no key.
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --ignore-scripts
      # The host stage runs the built plugin on the stock 2.4.1 binary, so the tag's checks are the pull request's.
      - name: Stock OpenCode 2.4.1 binary
        run: |
          platform="$(node -p 'process.platform')-$(node -p 'process.arch')"
          dir="$RUNNER_TEMP/stock-2.4.1"
          mkdir -p "$dir"
          (cd "$dir" && npm init -y >/dev/null && npm install "@opencode/cli@2.4.1" "@opencode/cli-$platform@2.4.1" --omit=optional --ignore-scripts --no-audit --no-fund)
          echo "OPENCODE_BIN_2_4_1=$dir/node_modules/@opencode/cli-$platform/bin/opencode" >> "$GITHUB_ENV"
      - name: The browser stage's headless Chromium
        run: npx --no-install playwright-core install --with-deps --only-shell chromium
      - run: npm run check
      - name: dist/ is current
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- dist THIRD_PARTY_NOTICES.md licenses)" ]; then
            echo "::error::the tagged commit's generated files are not what the build writes; commit them before tagging."
            exit 1
          fi
      - name: Pack the release files
        run: |
          set -euo pipefail
          mkdir -p release
          npx --no-install plugin-kit check --json > release/conformance.json
          npm pack --pack-destination release
          sha256sum release/*.tgz release/conformance.json > release/SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release/*.tgz release/conformance.json release/SHA256SUMS --repo "$REPO" --verify-tag --title "$TAG" --generate-notes
